name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK packages
        run: |
          set +e
          sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0" > sdk-install.log 2>&1
          result=$?
          cat sdk-install.log
          exit $result
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: set -o pipefail; ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee android-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NightOwl-Android-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            android-build.log
            sdk-install.log
          if-no-files-found: warn
