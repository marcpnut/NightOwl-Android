name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK packages
        run: |
          set +e
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" > sdk-install.log 2>&1
          result=$?
          cat sdk-install.log
          exit $result
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: set -o pipefail; ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee android-build.log
      - name: Give APK its release filename
        run: cp app/build/outputs/apk/debug/app-debug.apk NightOwl-Android-0.2.2.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NightOwl-Android-0.2.2
          path: |
            NightOwl-Android-0.2.2.apk
            android-build.log
            sdk-install.log
          if-no-files-found: warn
      - name: Publish downloadable APK release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.2.2 NightOwl-Android-0.2.2.apk --title "NightOwl Android 0.2.2" --generate-notes
